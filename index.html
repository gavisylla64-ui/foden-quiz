<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foden-Quiz</title>
<style>
:root{--bg:#FFD21F;--card:#FFFDF2;--ink:#1A1A1A;--accent:#FFD21F;--on:#1A1A1A;--ok:#BDEBC6;--ko:#FFB8AE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150B;--card:#26230F;--ink:#F6EFD0;--ok:#2F5A3A;--ko:#6A2F28}}
:root[data-theme="dark"]{--bg:#17150B;--card:#26230F;--ink:#F6EFD0;--ok:#2F5A3A;--ko:#6A2F28}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 120px}
h1,h2{font-weight:800;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px}
.pill{border:3px solid var(--ink);border-radius:99px;padding:4px 12px;background:var(--card);font-weight:700;font-size:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--ink);margin-bottom:18px}
.bar{height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card)}
.bar i{display:block;height:100%;background:#B79CFF;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:3px solid var(--ink);border-radius:99px;padding:8px 14px;background:var(--card);color:var(--ink);font:700 15px inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on)}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--accent);color:var(--on);font:800 18px inherit;font-family:inherit;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:4px solid #5B7CFF;outline-offset:2px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.qtop .bar{flex:1}
.tag{display:inline-block;border:3px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;font-size:14px;color:var(--on);margin-bottom:10px}
.q{font-size:22px;font-weight:800;line-height:1.25}
.opt{display:block;width:100%;text-align:left;margin-top:12px;border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--card);color:var(--ink);font:600 17px inherit;font-family:inherit;cursor:pointer}
.opt.ok{background:var(--ok)}.opt.ko{background:var(--ko)}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);border-radius:24px 24px 0 0;background:var(--ok);animation:up .25s}
.sheet.ko{background:var(--ko)}
.sheet>div{max-width:480px;margin:0 auto}
.sheet h2{font-size:22px;margin-bottom:6px}
.link{background:none;border:0;color:var(--ink);font:700 15px inherit;font-family:inherit;text-decoration:underline;margin:10px 0;cursor:pointer;padding:0}
.exp{margin:6px 0 12px}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0}
.c{text-align:center}
.mt{margin-top:12px}
.node{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);color:var(--on);font:800 22px inherit;font-family:inherit;box-shadow:0 4px 0 var(--ink);cursor:pointer;flex:none}
.node:disabled{opacity:.5;cursor:not-allowed;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
.row span{font-weight:700}
.txt{white-space:pre-line;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.g2 .btn{font-size:16px;padding:14px 6px}
.in{display:block;width:100%;margin:6px 0 14px;padding:12px;border:3px solid var(--ink);border-radius:14px;font:600 17px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
label{font-weight:700}
.card.got{background:var(--accent);color:var(--on)}
.em{font-size:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:800;z-index:60;text-align:center}
.cf{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;z-index:50;pointer-events:none}
.wheel{width:260px;height:260px;border-radius:50%;border:4px solid var(--ink);margin:0 auto 18px;position:relative;box-shadow:0 5px 0 var(--ink)}
.wl{position:absolute;left:50%;top:50%;width:70px;margin:-18px 0 0 -35px;text-align:center;font:700 12px/1.15 system-ui,sans-serif;color:#1A1A1A}
.wp{font-size:28px;line-height:1;margin-bottom:-8px}
#bgl{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
.part{font-size:16px;margin:22px 0 4px}
.jk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.jk .btn{font-size:14px;padding:10px 4px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av{position:relative;flex:none;width:56px;height:56px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:30px;background:#fff}
.av.s2{background:#BFD9FF}.av.s3{background:#FFD21F}
.av i{position:absolute;font-style:normal;line-height:1}
.av .st{right:-8px;bottom:-6px;font-size:20px}
.av .cr{top:-20px;left:50%;transform:translateX(-50%);font-size:24px}
.tb{display:grid;grid-template-columns:34px 1fr 52px 38px 58px;gap:4px;align-items:center;padding:8px 4px;border-bottom:2px solid var(--ink)}
.tb.th{font-weight:800;font-size:13px}
.tb.top{font-size:18px;font-weight:800}
.tb.me{background:var(--accent);color:var(--on);border-radius:10px}
.tb .link{margin:0;font-size:13px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
</style>
</head>

/* =====================================================
   FODEN-QUIZ : LOGIQUE
   1 État+sauvegarde  2 Outils  3 Profil/avatar  4 Accueil+Défi
   5 Quiz+jokers  6 Carte+fiches  7 Badges  8 Roue  9 Blitz
   10 Duel+Famille  11 Classement  12 Démarrage
   ===================================================== */

/* ---------- 1. ÉTAT DU JOUEUR + SAUVEGARDE ---------- */
// Tout ce qui est dans S est sauvegardé dans le téléphone (localStorage)
var S={v:2,pseudo:"",avatar:"",streak:0,last:"",today:"",done:0,good:0,lv:1,pts:0,lives:0,j5:3,jt:3,jp:3,best:0,b:{},dc:"",dcr:0,friends:[]};
var T,run=null,sel=["Géographie","Histoire","Fun facts"],app=document.getElementById("app");
function dayStr(n){return new Date(Date.now()+n*864e5).toISOString().slice(0,10)}
function today(){return dayStr(0)}
// Lit la sauvegarde au démarrage
function load(){
 var d={};try{d=JSON.parse(localStorage.getItem("foden")||"{}")}catch(e){}
 for(var k in d)S[k]=d[k];
 if(!d.v){S.j5=Math.max(S.j5,3);S.jt=Math.max(S.jt,3);S.jp=Math.max(S.jp,3)} // anciens joueurs : 3 jokers
 S.v=2;
 if(S.today!==today()){S.today=today();S.done=0} // nouveau jour : objectif remis à 0
}
// Écrit la sauvegarde
function save(){try{localStorage.setItem("foden",JSON.stringify(S))}catch(e){}}

/* ---------- 2. PETITS OUTILS ---------- */
var AV=["🦁","🐘","🐯","🦊","🐼","🐸","🦉","🐵"];
var B=[["feu","🔥","En Feu","3 bonnes réponses d’affilée"],["parfait","🎯","Sans Faute","6/6 à un quiz"],["semaine","📅","Champion de la semaine","7 jours de suite"],["explo","🧭","Explorateur","Finir toute la partie Géographie"],["genie","🧠","Génie","Finir toutes les thématiques"],["chance","🎁","Chanceux","Gagner le badge surprise à la roue"]];
var WH=[["+50 points","#FFC2D4"],["+100 points","#BFD9FF"],["+1 vie ❤️","#BDEBC6"],["Joker 50/50","#D9C7FF"],["Joker +10 s","#FFD9A8"],["Badge surprise 🎁","#FFB8D9"]];
// Protège les textes saisis par le joueur (pseudos)
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
// Niveau du joueur : +1 tous les 10 bonnes réponses
function lvlOf(){return 1+Math.floor(S.good/10)}
function titre(){var n=Object.keys(S.b).length;return n>4?"Maître du quiz":n>2?"Savant":n>0?"Curieux":"Débutant"}
// Petit message en haut de l’écran
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;d.style.marginTop=document.querySelectorAll(".toast").length*50+"px";document.body.appendChild(d);setTimeout(function(){d.remove()},3500)}
// Donne 1 joker au hasard
function giveJoker(){var k=["j5","jt","jp"][Math.floor(Math.random()*3)];S[k]++;save();toast("🃏 +1 joker : "+{j5:"50/50",jt:"+10 s",jp:"Passer"}[k])}
// Débloque un badge (une seule fois)
function unlock(id){if(S.b[id])return;S.b[id]=1;save();toast("🏅 Nouveau badge : "+B.filter(function(b){return b[0]===id})[0][2])}
// Confettis
function conf(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;var c=["#FF4D6D","#4D96FF","#6BCB77","#B79CFF","#FFD21F"];for(var i=0;i<50;i++){(function(e){e.className="cf";e.style.cssText="left:"+Math.random()*100+"vw;background:"+c[i%5];document.body.appendChild(e);e.animate([{transform:"translateY(0) rotate(0deg)"},{transform:"translateY(105vh) rotate("+(360+Math.random()*360)+"deg)"}],{duration:1800+Math.random()*1500,delay:Math.random()*400,fill:"forwards"}).onfinish=function(){e.remove()}})(document.createElement("i"))}}
// Fait avancer la série de jours (une seule fois par jour)
function bump(){
 if(S.last===today())return;
 if(S.last===dayStr(-1))S.streak++;
 else if(S.last===dayStr(-2)&&S.lives>0){S.lives--;S.streak++} // une vie sauve un jour manqué
 else S.streak=1;
 S.last=today();if(S.streak>=7)unlock("semaine");
}

/* ---------- 3. PROFIL ET AVATAR ---------- */
// L’avatar évolue : Niv 1-2 normal, 3-4 étoile + bleu, 5+ couronne + doré
function avatar(){var l=lvlOf(),c=l>=5?"s3":l>=3?"s2":"s1";return '<span class="av '+c+'">'+(l>=5?'<i class="cr">👑</i>':'')+S.avatar+(l>=3&&l<5?'<i class="st">⭐</i>':'')+'</span>'}
// Écran de choix du pseudo et de l’avatar
function setup(){
 var cur=S.avatar||AV[0];
 app.innerHTML='<div class="top"><div class="logo">Foden-Quiz</div></div><div class="card"><h2>Ton profil</h2><label>Ton pseudo<input id="ps" class="in" maxlength="12" autocomplete="off" value="'+esc(S.pseudo)+'"></label><b>Ton avatar</b><div class="chips" id="avs">'+AV.map(function(a){return '<button class="chip" style="--c:#FFE680;font-size:26px" aria-pressed="'+(a===cur)+'" data-a="'+a+'">'+a+'</button>'}).join('')+'</div></div><button class="btn" id="ok">Commencer</button>';
 app.querySelectorAll("#avs .chip").forEach(function(b){b.onclick=function(){cur=b.dataset.a;app.querySelectorAll("#avs .chip").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}});
 document.getElementById("ok").onclick=function(){S.pseudo=document.getElementById("ps").value.trim()||"Joueur";S.avatar=cur;save();home()};
}

/* ---------- 4. ACCUEIL + DÉFI DU JOUR ---------- */
function home(){
 if(!S.avatar)return setup();
 stop();clearInterval(T);save();
 var g=Math.min(S.done,3),chips=Object.keys(TH).map(function(t){return '<button class="chip" style="--c:'+TH[t]+'" aria-pressed="'+(sel.indexOf(t)>-1)+'" data-t="'+t+'">'+t+'</button>'}).join('');
 app.innerHTML='<div class="top"><div class="logo">Foden-Quiz</div><div class="pill">⭐ '+S.pts+'</div></div>'+
 '<div class="card row" id="pf" style="padding-top:26px;cursor:pointer">'+avatar()+'<div><b>'+esc(S.pseudo)+'</b><br>Niv. '+lvlOf()+' · '+titre()+(S.lives?' · ❤️ '+S.lives:'')+'</div></div>'+
 '<div class="card"><b>🔥 '+S.streak+' jour'+(S.streak>1?'s':'')+' de suite</b><div class="mt"><b>Objectif quotidien '+g+'/3</b></div><div class="bar mt"><i style="width:'+(g/3*100)+'%"></i></div></div>'+
 '<div class="card"><h2>🎯 Défi du Jour</h2>'+(S.dc===today()?'<p>'+(S.dcr?'Réussi ✅ Ta série continue !':'Raté ❌ Reviens demain.')+'</p>':'<p>Réponds juste pour garder ta série de jours.</p><button class="btn" id="dc">Relever le défi</button>')+'</div>'+
 '<div class="card"><h2>Thématiques</h2><div class="chips">'+chips+'</div></div>'+
 '<button class="btn" id="go"'+(sel.length?'':' disabled')+'>Lancer le quiz</button>'+
 '<div class="g2"><button class="btn" id="du">Défier un ami</button><button class="btn" id="fa">Jouer en Famille</button><button class="btn" id="bz">Mode Blitz ⚡</button><button class="btn" id="mp">Carte des niveaux</button><button class="btn" id="fi">Fiches de lecture</button><button class="btn" id="cl">Classement</button></div><button class="btn" id="bg">Mes Badges</button><button class="btn mt" id="bgd">🌊 Fond par défaut</button>';
 app.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){var t=b.dataset.t,i=sel.indexOf(t);if(i>-1)sel.splice(i,1);else sel.push(t);home()}});
 var f={go:start,du:duelSetup,fa:famSetup,bz:blitz,mp:map,fi:fiches,cl:board,bg:badges,pf:setup,dc:defi,bgd:function(){S.bg="";save();applyBg()}};
 for(var k in f){var e=document.getElementById(k);if(e)e.onclick=f[k]}
}
// Question spéciale du jour : la même pour tous, différente chaque jour
function defi(){
 if(S.dc===today())return home();
 stop();var q=Q[(Math.floor(Date.now()/864e5)*7)%Q.length],o=shuffle(q[2].map(function(x,k){return{o:x,r:k===q[3]}}));
 app.innerHTML=back()+'<div class="card"><span class="tag" style="background:'+TH[q[0]]+'">🎯 Défi du Jour · '+q[0]+'</span><div class="q">'+q[1]+'</div></div>'+o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x.o+'</button>'}).join('')+'<div id="fb"></div>';
 document.getElementById("bk").onclick=home;
 var lock=false,bs=app.querySelectorAll(".opt");
 bs.forEach(function(b){b.onclick=function(){
  if(lock)return;lock=true;var r=o[b.dataset.k].r;
  bs.forEach(function(e,k){if(o[k].r)e.classList.add("ok")});if(!r)b.classList.add("ko");
  S.dc=today();S.dcr=r?1:0;
  if(r){bump();S.pts+=20}else{S.streak=0;S.last=today()} // juste : on garde la série / faux : on la perd
  save();
  document.getElementById("fb").innerHTML='<div class="sheet'+(r?'':' ko')+'"><div><h2>'+(r?'Bravo ! 🔥 '+S.streak+' jour'+(S.streak>1?'s':'')+' de suite':'Raté… la série est perdue')+'</h2><p class="exp">'+q[4]+'</p><button class="btn" id="nx">Retour</button></div></div>';
  document.getElementById("nx").onclick=home;if(r)conf();
 }});
}

/* ---------- 5. QUIZ : 6 questions, 15 s, voix, jokers ---------- */
function start(){var pool=Q.filter(function(q){return sel.indexOf(q[0])>-1});run={qs:shuffle(pool).slice(0,6),i:0,ok:0};ask()}
// Équipe qui joue en ce moment (duel / famille)
function turn(){return run.t.mode==="duel"?run.t.p:run.i%run.t.n.length}
function ask(){
 var q=run.qs[run.i],opts=shuffle(q[2].map(function(o,k){return{o:o,r:k===q[3]}}));
 // boutons jokers (pas en duel ni en famille)
 var jk=run.t?'':'<div class="jk">'+[["j5","50/50"],["jt","+10 s"],["jp","Passer"]].map(function(j){return '<button class="btn" id="'+j[0]+'"'+(S[j[0]]>0?'':' disabled')+'>'+j[1]+' ('+S[j[0]]+')</button>'}).join('')+'</div>';
 app.innerHTML='<div class="qtop"><button class="x" id="quit" aria-label="Quitter">✕</button><div class="bar"><i style="width:'+(run.i/run.qs.length*100)+'%"></i></div><button class="x" id="vo" aria-label="Voix">'+(S.voice===false?'🔇':'🔊')+'</button><span class="pill" id="tm">15</span></div>'+
 '<div class="card"><span class="tag" style="background:'+TH[q[0]]+'">'+q[0]+'</span><div class="q">'+q[1]+'</div></div>'+(run.t?'<p class="c"><b>Au tour de '+esc(run.t.n[turn()])+'</b></p>':'')+
 opts.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x.o+'</button>'}).join('')+jk+'<div id="fb"></div>';
 document.getElementById("quit").onclick=function(){clearInterval(T);stop();home()};
 var bs=app.querySelectorAll(".opt"),locked=false,left=15,tm=document.getElementById("tm");
 clearInterval(T);
 // la voix lit la question
 function say(){stop();if(S.voice!==false&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(q[1]);u.lang="fr-FR";speechSynthesis.speak(u)}}
 say();
 document.getElementById("vo").onclick=function(){S.voice=S.voice===false;save();this.textContent=S.voice===false?"🔇":"🔊";say()};
 // jokers : on retire 1 joker et on désactive le bouton
 function use(id){S[id]--;save();var b=document.getElementById(id);b.disabled=true;b.textContent=b.textContent.replace(/\(\d+\)/,"("+S[id]+")")}
 if(!run.t){
  document.getElementById("j5").onclick=function(){if(locked)return;use("j5");var n=0;shuffle(opts.map(function(x,k){return k})).forEach(function(k){if(!opts[k].r&&n<2){n++;bs[k].disabled=true;bs[k].style.opacity=.3}})};
  document.getElementById("jt").onclick=function(){if(locked)return;use("jt");left+=10;tm.textContent=left;tm.style.background=""};
  document.getElementById("jp").onclick=function(){if(locked)return;locked=true;use("jp");clearInterval(T);stop();run.i++;if(run.i<run.qs.length)ask();else end()};
 }
 // chronomètre de 15 secondes
 T=setInterval(function(){left--;tm.textContent=left;if(left<=5)tm.style.background="var(--ko)";if(left<=0){clearInterval(T);if(locked)return;locked=true;stop();run.cons=0;bs.forEach(function(e,k){if(opts[k].r)e.classList.add("ok")});feedback(false,q[4],true)}},1000);
 // quand le joueur choisit une réponse
 bs.forEach(function(b){b.onclick=function(){
  if(locked)return;locked=true;clearInterval(T);stop();
  var r=opts[b.dataset.k].r;
  bs.forEach(function(e,k){if(opts[k].r)e.classList.add("ok")});
  run.cons=r?(run.cons||0)+1:0;
  if(r){run.ok++;if(run.t)run.t.s[turn()]++;else S.pts+=10}else b.classList.add("ko");
  if(run.cons>=3)unlock("feu");
  feedback(r,q[4]);
 }});
}
// Message après la réponse (bonne / faux pas / temps écoulé)
function feedback(r,exp,late){
 if(run.t&&run.t.mode==="duel"&&run.t.p===0){run.t.p=1;return pass()} // duel : le 1er joueur ne voit pas la réponse
 var last=run.i===run.qs.length-1;
 document.getElementById("fb").innerHTML='<div class="sheet'+(r?'':' ko')+'" role="status"><div><h2>'+(r?'Bonne réponse !':late?'Temps écoulé':'Petit faux pas')+'</h2><button class="link" id="ex">Voir l’explication</button><p class="exp" id="et" hidden>'+exp+'</p><button class="btn" id="nx">'+(last?'Terminer':'Continuer')+'</button></div></div>';
 document.getElementById("ex").onclick=function(){document.getElementById("et").hidden=false;this.hidden=true};
 document.getElementById("nx").onclick=function(){
  if(run.t){if(run.t.mode==="duel")run.t.p=0;run.i++;return run.i<run.qs.length?pass():teamEnd()}
  run.i++;if(run.i<run.qs.length)ask();else end();
 };
 document.getElementById("nx").focus();
}
// Fin d’un quiz normal ou d’un niveau de la carte
function end(){
 var L0=lvlOf();S.good+=run.ok;S.done++;
 if(run.lvl&&run.ok>=2&&S.lv===run.lvl)S.lv++;          // niveau de la carte réussi
 if(lvlOf()>L0){giveJoker();toast("⬆️ Niveau "+lvlOf()+" !")} // monter de niveau = 1 joker
 if(run.ok===6&&run.qs.length===6)unlock("parfait");
 if(S.lv>4)unlock("explo");if(S.lv>24)unlock("genie");
 bump();save();
 app.innerHTML='<div class="card c" style="margin-top:40px"><h2>Apprentissage terminé !</h2><div class="big">'+run.ok+'/'+run.qs.length+'</div><p>'+(run.ok===run.qs.length?'Sans faute. Continue comme ça !':'Ta curiosité paie. Continue d’explorer et d’apprendre !')+'</p></div>'+
 (run.qs.length===6&&run.ok>=4?'<button class="btn" id="wh">🎡 Tourner la roue</button>':'')+
 '<button class="btn mt" id="again">'+(run.lvl?'Carte des niveaux':'Rejouer')+'</button><button class="link" style="display:block;margin:16px auto" id="hm">Retour à l’accueil</button>';
 document.getElementById("again").onclick=run.lvl?map:start;document.getElementById("hm").onclick=home;
 var w=document.getElementById("wh");if(w)w.onclick=wheel;
}

// Bouton retour en haut des pages
function back(){return "<div class=\"qtop\"><button class=\"x\" id=\"bk\" aria-label=\"Retour\">←</button></div>"}
// Arrête la voix
function stop(){if(window.speechSynthesis)speechSynthesis.cancel()}
/* ---------- 6. CARTE DES NIVEAUX ---------- */
// 6 parties (une par thème), 4 niveaux chacune, 3 questions par niveau
function map(){stop();var r="",K=Object.keys(TH);
 for(var i=1;i<=24;i++){var t=K[Math.floor((i-1)/4)],o=i<=S.lv;if(i%4==1){r+="<h2 class=\"part\">"+(i>20?"Élite":"Partie "+((i+3)/4))+" · "+t+"</h2>"}r+="<div class=\"row\" style=\"margin-left:"+[0,50,90,50][i%4]+"px\"><button class=\"node\" data-l=\""+i+"\""+(o?"":" disabled")+" style=\"background:"+(o?TH[t]:"var(--card)")+"\" aria-label=\"Niveau "+i+", "+t+"\">"+(!o?"🔒":i<S.lv?"★":i)+"</button><span>"+t+"</span></div>"}
 app.innerHTML=back()+"<h2>Carte des niveaux</h2><p>Réussis au moins 2 questions sur 3 pour débloquer le niveau suivant.</p>"+r;
 document.getElementById("bk").onclick=home;
 app.querySelectorAll(".node").forEach(function(b){b.onclick=function(){var l=+b.dataset.l,t=K[Math.floor((l-1)/4)],h=(l-1)%4*3;run={lvl:l,qs:shuffle(Q.filter(function(q){return q[0]===t}).slice(h,h+3)),i:0,ok:0};ask()}})}
/* ---------- FICHES DE LECTURE (+ audio) ---------- */
// Liste des fiches
function fiches(){stop();app.innerHTML=back()+"<h2>Fiches de lecture</h2>"+F.map(function(f,i){return "<button class=\"opt\" data-i=\""+i+"\"><span class=\"tag\" style=\"background:"+TH[f[0]]+"\">"+f[0]+"</span><br>"+f[1]+"</button>"}).join("");
 document.getElementById("bk").onclick=home;
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){fiche(+b.dataset.i)}})}
// Une fiche, avec le bouton Écouter (voix du téléphone)
function fiche(i){var f=F[i];
 app.innerHTML=back()+"<div class=\"card\"><span class=\"tag\" style=\"background:"+TH[f[0]]+"\">"+f[0]+"</span><h2>"+f[1]+"</h2><p class=\"txt\">"+f[2]+"</p></div>"+(window.speechSynthesis?"<button class=\"btn\" id=\"au\">Écouter</button>":"<p>L’audio n’est pas disponible sur cet appareil.</p>");
 document.getElementById("bk").onclick=fiches;
 var a=document.getElementById("au");
 if(a)a.onclick=function(){if(speechSynthesis.speaking){stop();a.textContent="Écouter";return}var u=new SpeechSynthesisUtterance(f[1]+". "+f[2]);u.lang="fr-FR";u.onend=function(){a.textContent="Écouter"};speechSynthesis.speak(u);a.textContent="Arrêter"}}


/* ---------- 7. BADGES ET TITRES ---------- */
function badges(){stop();app.innerHTML=back()+'<h2>Mes Badges</h2><p>Titre : <b>'+titre()+'</b> · '+Object.keys(S.b).length+'/'+B.length+'</p>'+B.map(function(b){var o=S.b[b[0]];return '<div class="card row'+(o?' got':'')+'"'+(o?'':' style="opacity:.55;filter:grayscale(1)"')+'><span class="em">'+(o?b[1]:'🔒')+'</span><div><b>'+b[2]+'</b><br>'+b[3]+'</div></div>'}).join('');document.getElementById("bk").onclick=home}

/* ---------- 8. ROUE DE LA CHANCE ---------- */
function wheel(){
 stop();
 var g=WH.map(function(w,i){return w[1]+' '+i*60+'deg '+(i+1)*60+'deg'}).join(','),l=WH.map(function(w,i){return '<span class="wl" style="transform:rotate('+(i*60+30)+'deg) translateY(-92px)">'+w[0].replace(' ','<br>')+'</span>'}).join('');
 app.innerHTML='<div class="c" style="margin-top:20px"><h2>Roue de la chance</h2><div class="wp">▼</div><div class="wheel" id="wl" style="background:conic-gradient('+g+')">'+l+'</div></div><button class="btn" id="sp">Tourner la roue</button>';
 document.getElementById("sp").onclick=function(){
  var b=this,k=Math.floor(Math.random()*6),rd=matchMedia("(prefers-reduced-motion:reduce)").matches,w=document.getElementById("wl");
  b.disabled=true;w.style.transition=rd?"none":"transform 4s cubic-bezier(.17,.67,.2,1)";w.style.transform="rotate("+(2130-k*60)+"deg)"; // la case k s’arrête sous la flèche
  setTimeout(function(){reward(k);giveJoker();b.disabled=false;b.textContent="Continuer";b.onclick=home;conf()},rd?0:4200);
 };
}
function reward(k){
 var m=["+50 points","+100 points","+1 vie ❤️","un Joker 50/50","un Joker +10 s","un badge surprise 🎁"][k];
 if(k===0)S.pts+=50;if(k===1)S.pts+=100;if(k===2)S.lives++;if(k===3)S.j5++;if(k===4)S.jt++;if(k===5)unlock("chance");
 save();var p=document.createElement("p");p.className="c";p.innerHTML="<b>Tu gagnes "+m+" !</b>";document.getElementById("sp").before(p);
}

/* ---------- 9. MODE BLITZ ⚡ (60 secondes) ---------- */
function blitz(){
 var pool=shuffle(Q),i=0,sc=0,left=60,lock=false,dead=false,cons=0;stop();clearInterval(T);
 function show(){
  var q=pool[i%pool.length],o=shuffle(q[2].map(function(x,k){return{o:x,r:k===q[3]}}));
  document.getElementById("bq").innerHTML='<span class="tag" style="background:'+TH[q[0]]+'">'+q[0]+'</span><div class="q">'+q[1]+'</div>';
  document.getElementById("bo").innerHTML=o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x.o+'</button>'}).join('');lock=false;
  document.querySelectorAll("#bo .opt").forEach(function(b,k){b.onclick=function(){
   if(lock)return;lock=true;var r=o[k].r;b.classList.add(r?"ok":"ko");
   sc+=r?10:-5;cons=r?cons+1:0;if(cons>=3)unlock("feu");   // +10 / -5
   document.getElementById("bs").textContent="⚡ "+sc;
   setTimeout(function(){i++;if(!dead&&left>0)show()},350);
  }});
 }
 function fin(){
  dead=true;var nb=sc>S.best;if(nb)S.best=sc;S.pts+=Math.max(sc,0);save();
  app.innerHTML='<div class="card c" style="margin-top:30px"><h2>Mode Blitz ⚡</h2><div class="big">'+sc+'</div><p>Meilleur score : <b>'+S.best+'</b>'+(nb?' 🏆 Nouveau record !':'')+'</p></div><button class="btn" id="rb">Rejouer</button><button class="link" style="display:block;margin:16px auto" id="hm">Retour à l’accueil</button>';
  document.getElementById("rb").onclick=blitz;document.getElementById("hm").onclick=home;if(nb&&sc>0)conf();
 }
 app.innerHTML='<div class="qtop"><button class="x" id="quit" aria-label="Quitter">✕</button><span class="pill" id="bt">60</span><span class="pill" id="bs">⚡ 0</span></div><div class="card" id="bq"></div><div id="bo"></div>';
 document.getElementById("quit").onclick=function(){dead=true;clearInterval(T);home()};
 show();
 T=setInterval(function(){left--;document.getElementById("bt").textContent=left;if(left<=0){clearInterval(T);fin()}},1000);
}

/* ---------- 10. DUEL 1 CONTRE 1 + MODE FAMILLE ---------- */
// run.t = {mode:"duel" ou "fam", n:noms, s:scores, p:joueur en cours (duel)}
function duelSetup(){
 app.innerHTML=back()+'<h2>Défier un ami</h2><div class="card"><label>Ton pseudo<input id="p1" class="in" maxlength="12" autocomplete="off" value="'+esc(S.pseudo)+'"></label><label>Pseudo de ton ami<input id="p2" class="in" maxlength="12" autocomplete="off"></label></div><button class="btn" id="dg">C’est parti</button>';
 document.getElementById("bk").onclick=home;
 document.getElementById("dg").onclick=function(){duel([document.getElementById("p1").value.trim()||"Joueur 1",document.getElementById("p2").value.trim()||"Joueur 2"])};
}
function duel(n){run={t:{mode:"duel",n:n,p:0,s:[0,0]},qs:shuffle(Q).slice(0,5),i:0,ok:0};pass()} // mêmes 5 questions pour les 2
function famSetup(){
 var n=2,nm=["","","",""],P=["Équipe Papa","Équipe Maman","Équipe Enfants","Équipe Amis"];
 function keep(){app.querySelectorAll(".tn").forEach(function(e,i){nm[i]=e.value})}
 function draw(){
  app.innerHTML=back()+'<h2>Jouer en Famille</h2><div class="card"><b>Nombre d’équipes</b><div class="chips">'+[2,3,4].map(function(k){return '<button class="chip" style="--c:#FFE680" aria-pressed="'+(k===n)+'" data-k="'+k+'">'+k+'</button>'}).join('')+'</div><div class="mt">'+P.slice(0,n).map(function(x,i){return '<label>Équipe '+(i+1)+'<input class="in tn" maxlength="14" placeholder="'+x+'" value="'+esc(nm[i])+'"></label>'}).join('')+'</div></div><button class="btn" id="fg">C’est parti</button>';
  document.getElementById("bk").onclick=home;
  app.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){keep();n=+b.dataset.k;draw()}});
  document.getElementById("fg").onclick=function(){keep();fam(nm.slice(0,n).map(function(x,i){return x.trim()||P[i]}))};
 }
 draw();
}
function fam(n){run={t:{mode:"fam",n:n,p:0,s:n.map(function(){return 0})},qs:shuffle(Q).slice(0,n.length*3),i:0,ok:0};pass()} // 3 questions par équipe
// Écran « passe le téléphone »
function pass(){
 stop();clearInterval(T);
 app.innerHTML='<div class="card c" style="margin-top:40px"><h2>Passe le téléphone à</h2><div class="big">'+esc(run.t.n[turn()])+'</div><p>Question '+(run.i+1)+'/'+run.qs.length+'</p></div><button class="btn" id="rd">Je suis prêt</button>';
 document.getElementById("rd").onclick=ask;
}
// Écran final : gagnant, scores et classement des équipes
function teamEnd(){
 stop();clearInterval(T);
 var t=run.t,per=t.mode==="duel"?5:3,o=t.n.map(function(n,i){return{n:n,s:t.s[i]}}).sort(function(a,b){return b.s-a.s});
 app.innerHTML='<div class="card c" style="margin-top:30px"><h2>'+(o[0].s===o[1].s?'Égalité !':'🏆 '+esc(o[0].n)+' gagne !')+'</h2>'+(t.mode==="duel"?'<div class="big">'+t.s[0]+' – '+t.s[1]+'</div>':'')+'</div><div class="card">'+o.map(function(x,i){return '<div class="row"><span class="em">'+["🥇","🥈","🥉","4️⃣"][i]+'</span><b style="flex:1">'+esc(x.n)+'</b><b>'+x.s+'/'+per+'</b></div>'}).join('')+'</div><button class="btn" id="rv">'+(t.mode==="duel"?'Revanche':'Rejouer')+'</button><button class="link" style="display:block;margin:16px auto" id="hm">Retour à l’accueil</button>';
 document.getElementById("rv").onclick=function(){t.mode==="duel"?duel(t.n):fam(t.n)};
 document.getElementById("hm").onclick=home;
 if(o[0].s!==o[1].s)conf();
}

/* ---------- 11. CLASSEMENT ENTRE AMIS ---------- */
// Pas de serveur : on ajoute à la main les scores de ses amis
function board(){
 stop();
 var me={n:S.pseudo,p:S.pts,l:lvlOf(),b:Object.keys(S.b).length,me:1},
 all=S.friends.map(function(f,i){return{n:f.n,p:f.p,l:f.l,b:f.b,i:i}}).concat([me]).sort(function(a,b){return b.p-a.p});
 app.innerHTML=back()+'<h2>Classement</h2><p>Ton rang : <b>#'+(all.indexOf(me)+1)+'</b> sur '+all.length+'</p><div class="card"><div class="tb th"><span></span><span>Pseudo</span><span>Points</span><span>Niv.</span><span>Badges</span></div>'+
 all.map(function(x,i){return '<div class="tb'+(i<3?' top':'')+(x.me?' me':'')+'"><span>'+(["🥇","🥈","🥉"][i]||i+1)+'</span><span>'+esc(x.n)+'</span><span>'+x.p+'</span><span>'+x.l+'</span><span>'+x.b+(x.me?'':' <button class="link" data-d="'+x.i+'" aria-label="Retirer">✕</button>')+'</span></div>'}).join('')+'</div>'+
 '<div class="card"><b>Ajouter un ami</b><p>Demande-lui son score et entre-le ici.</p><input id="fn" class="in" maxlength="12" placeholder="Pseudo" autocomplete="off"><div class="g3"><input id="fp" class="in" type="number" inputmode="numeric" min="0" placeholder="Points"><input id="fl" class="in" type="number" inputmode="numeric" min="1" placeholder="Niv."><input id="fx" class="in" type="number" inputmode="numeric" min="0" max="6" placeholder="Badges"></div><button class="btn" id="fa2">Ajouter</button></div>';
 document.getElementById("bk").onclick=home;
 app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){S.friends.splice(+b.dataset.d,1);save();board()}});
 document.getElementById("fa2").onclick=function(){
  var n=document.getElementById("fn").value.trim();if(!n)return;
  function v(id,d){var x=parseInt(document.getElementById(id).value,10);return isNaN(x)||x<0?d:x}
  S.friends.push({n:n,p:v("fp",0),l:v("fl",1),b:v("fx",0)});save();board();
 };
}

// Met la photo en fond, avec un voile jaune pour garder le texte lisible
// S.bg : "" = photo par défaut, "jaune" = fond jaune uni, sinon = photo choisie par le joueur
function applyBg(){
 var u=S.bg==="jaune"?"":(S.bg||BG_DEFAULT);
 var d=document.getElementById("bgl");
 if(!d){d=document.createElement("div");d.id="bgl";document.body.prepend(d)}
 d.style.backgroundImage=u?'linear-gradient(rgba(255,210,31,.28),rgba(255,210,31,.28)),url("'+u+'")':"none";
}

/* ---------- 12. DÉMARRAGE ---------- */
load();applyBg();home();
